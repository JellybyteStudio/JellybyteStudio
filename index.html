<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jellybyte Studio — Privacy Policies</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #facc15;
      --link: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
    }
    h1 { margin-top: 0; color: var(--accent); font-size: 1.8rem; }
    a { color: var(--link); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Jellybyte Studio</h1>
    <p class="muted">Official Privacy Policies &amp; Legal Information</p>
    <ul>
      <li><a href="./PrivacyPolicy/SnapJamBlockSort">Snap Jam: Block Color Sort — Privacy Policy</a></li>
    </ul>
    <p class="muted">Support: <a href="mailto:JellybyteStudio@protonmail.com">JellybyteStudio@protonmail.com</a></p>
  </main>
</body>
</html>
